[sdl]
autolock=true
vsync=true

[dosbox]
machine=svga_s3
memsize=64

[render]
aspect=true
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=max

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[autoexec]
@echo off
imgmount d "iso\REKENSTORM.ISO" -t cdrom
d:
echo.
echo ========================================================
echo  Ontdekkingstocht in de IJzige Rekenstorm (1997)
echo ========================================================
echo ISO mounted as drive D: with Sound Blaster 16 and SVGA.
echo.
echo NOTE: Analysis showed this disc contains purely 16-bit
echo Windows executables (Win16 / NE format) with NO DOS binaries.
echo For direct native play, use launch_rekenstorm.bat (otvdm).
echo In DOSBox-X, you can boot Windows 3.1 / Win95 to run it.
echo ========================================================
echo.
dir d:
